# Connects the inventory desk to the shared file.
# Repository secrets:
#   CLOUDFLARE_API_TOKEN      Workers Scripts edit
#   CLOUDFLARE_ACCOUNT_ID
#   INVENTORY_GITHUB_TOKEN    fine-grained token, this repo only, Contents read and write
name: Deploy inventory upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the upload secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INVENTORY_GITHUB_TOKEN: ${{ secrets.INVENTORY_GITHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$INVENTORY_GITHUB_TOKEN" ] || missing="$missing INVENTORY_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "Add these repository secrets, then run this workflow again:$missing"
            exit 1
          fi
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.INVENTORY_GITHUB_TOKEN }}
      - name: Point the desk at the upload service
        env:
          UPLOAD_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          python3 - <<'PY'
          import json, os
          url = os.environ.get("UPLOAD_URL", "").strip().rstrip("/")
          if not url.startswith("https://"):
              raise SystemExit("Wrangler did not return the upload address.")
          path = "docs/inventory/remote.json"
          with open(path, encoding="utf-8") as handle:
              current = json.load(handle)
          if current.get("uploadUrl") == url:
              open("/tmp/remote-changed", "w").write("no")
          else:
              with open(path, "w", encoding="utf-8") as handle:
                  json.dump({"uploadUrl": url}, handle, indent=2)
                  handle.write("\n")
              open("/tmp/remote-changed", "w").write("yes")
          print(url)
          PY
          if [ "$(cat /tmp/remote-changed)" = "yes" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/inventory/remote.json
            git commit -m "Point the inventory desk at the upload service."
            git push
          fi
